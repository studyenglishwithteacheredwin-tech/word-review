<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flyers Word Review</title>
<meta name="theme-color" content="#2E5C8A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Book house colours: blue = learn, purple = listen, pink = test, orange = highlights.
     Layout: one narrow phone column, a card per word, big tap targets for 7-10 year olds. */
  --blue: #2E5C8A; --purple: #7B4B94; --pink: #D6336C; --orange: #E8760A; --green: #2B8A3E;
  --ink: #1F2A36; --muted: #6B7787; --line: #DCE3EC; --card: #FFFFFF; --page: #EEF3F8; --soft: #F6F8FB;
  --font: "Andika", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--page); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.35;
  -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.wrap { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-block: 0 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; }
.top h1 { font-size: 22px; margin: 0; line-height: 1.1; text-wrap: balance; }
.top .sub { color: var(--muted); font-size: 13px; }
.back { width: 44px; height: 44px; border-radius: 12px; background: var(--card); border: 1px solid var(--line);
  display: grid; place-items: center; font-size: 22px; flex: none; }

/* home */
.hero { background: var(--blue); color: #fff; border-radius: 18px; padding: 16px 18px; display: grid; gap: 4px; }
.hero b { font-size: 26px; line-height: 1; }
.hero span { opacity: .85; font-size: 14px; }
.total { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 2px 10px; color: var(--muted); font-size: 14px; }
.tabs { display: flex; gap: 6px; margin: 14px 0 10px; background: var(--card); padding: 5px; border-radius: 14px; border: 1px solid var(--line); }
.tabs button { flex: 1; padding: 10px 6px; border-radius: 10px; font-weight: 700; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--orange); color: #fff; }
.units { display: grid; gap: 10px; }
.unit { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
.unit img, .unit .ph { width: 64px; height: 64px; object-fit: contain; border-radius: 10px; background: var(--soft); }
.unit .ph { display: grid; place-items: center; font-weight: 700; font-size: 22px; color: var(--blue); }
.unit .t { font-weight: 700; font-size: 18px; line-height: 1.15; }
.unit .n { color: var(--muted); font-size: 13px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--green); }
.stars { font-weight: 700; color: var(--green); font-size: 14px; font-variant-numeric: tabular-nums; }

/* unit */
.sound { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; background: #FDF0F4; border: 1.5px solid var(--pink);
  border-radius: 14px; padding: 8px 12px; margin-bottom: 10px; }
.sound .k { color: var(--pink); font-size: 13px; font-weight: 700; }
.sound .p { color: var(--pink); font-size: 22px; font-weight: 700; letter-spacing: .02em; }
.sound .nm { color: var(--muted); font-size: 13px; margin-left: auto; }
.sound .chips { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; margin-top: 2px; }
.sound .chip { display: flex; align-items: center; gap: 8px; background: #fff; border: 1.5px solid var(--pink); border-radius: 12px;
  padding: 6px 10px; font: inherit; color: var(--ink, #231F20); cursor: pointer; }
.sound .chip .l { color: var(--pink); font-size: 20px; font-weight: 700; }
.sound .chip .w { font-size: 16px; font-weight: 600; }
.sound .chip .w b { color: var(--pink); }
.sound .chip.on { background: var(--pink); color: #fff; }
.sound .chip.on .l, .sound .chip.on .w b { color: #fff; }
.sound .hint { width: 100%; color: var(--muted); font-size: 12px; }
.modes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
.modes button { padding: 9px 4px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-weight: 700; line-height: 1.1; }
.modes button small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
.modes button[aria-pressed="true"][data-m="learn"] { background: var(--blue); color: #fff; border-color: var(--blue); }
.modes button[aria-pressed="true"][data-m="listen"] { background: var(--purple); color: #fff; border-color: var(--purple); }
.modes button[aria-pressed="true"][data-m="spell"] { background: var(--orange); color: #fff; border-color: var(--orange); }
.modes button[aria-pressed="true"][data-m="test"] { background: var(--pink); color: #fff; border-color: var(--pink); }
.modes button[aria-pressed="true"] small { color: rgba(255,255,255,.85); }

.card { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: grid; gap: 10px; justify-items: center; text-align: center; }
.pic { width: min(100%, 34vh, 280px); aspect-ratio: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 16px; background: #fff; }
.pic img { width: 100%; height: 100%; min-width: 0; object-fit: contain; display: block; }
.pic .num { font-size: 96px; font-weight: 700; line-height: 1; }
.word { font-size: 40px; font-weight: 700; line-height: 1.05; overflow-wrap: anywhere; }
.word .tr { color: var(--pink); }
.syl { color: var(--muted); font-size: 16px; letter-spacing: .04em; }
.ipa { color: var(--blue, #2E5C8A); font-size: 17px; font-family: 'Charis SIL','Doulos SIL','Gentium Plus','Lucida Sans Unicode','Segoe UI',Arial,sans-serif; }
.ex { font-size: 16px; line-height: 1.4; text-align: center; max-width: 34ch; }
.ex b { color: var(--pink); }
.phr { background: #FDF0F4; border: 1.5px solid var(--pink); border-radius: 14px; padding: 8px 12px; margin: 6px 0 10px; font-size: 14px; display: grid; gap: 3px; }
.phr .k { color: var(--pink); font-size: 13px; font-weight: 700; }
.phr span { color: var(--muted); font-size: 12.5px; }
.vi { color: var(--muted); font-size: 16px; }
.hidden-word { font-size: 40px; font-weight: 700; color: var(--line); letter-spacing: .1em; }
.row { display: flex; gap: 10px; width: 100%; justify-content: center; flex-wrap: wrap; }
.btn { min-height: 52px; padding: 10px 18px; border-radius: 14px; font-weight: 700; font-size: 18px; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn.play { background: var(--orange); color: #fff; min-width: 150px; }
.btn.ghost { background: var(--soft); border: 1px solid var(--line); }
.btn.turtle { background: #E7F5EA; color: #1E6B30; border: 1.5px solid var(--green); }
.btn.blue { background: var(--blue); color: #fff; }
.btn.good { background: var(--green); color: #fff; flex: 1; }
.btn.again { background: #FFF1E6; color: #A34E00; border: 1.5px solid var(--orange); flex: 1; }
.btn[disabled] { opacity: .45; cursor: default; }
.nav { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; gap: 10px; width: 100%; }
.nav .count { color: var(--muted); font-variant-numeric: tabular-nums; }
.nav .arrow { height: 52px; border-radius: 14px; background: var(--soft); border: 1px solid var(--line); font-size: 24px; }
.hint { color: var(--muted); font-size: 13px; }

/* listen & pick */
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: min(100%, 40vh, 360px); }
.choice { aspect-ratio: 1; min-width: 0; overflow: hidden; border-radius: 16px; background: #fff; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; padding: 8px; }
.choice img { width: 100%; height: 100%; object-fit: contain; display: block; }
.choice .num { font-size: 44px; font-weight: 700; }
.choice.ok { border-color: var(--green); box-shadow: 0 0 0 3px rgba(43,138,62,.25); }
.choice.no { border-color: var(--pink); animation: shake .3s; opacity: .5; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { .choice.no { animation: none; } }
/* spell */
.pic.small { width: min(42%, 20vh, 160px); flex: none; }
.pic.small .num { font-size: 56px; }
.slots { display: flex; flex-wrap: nowrap; gap: 4px; justify-content: center; min-height: 52px; width: 100%; }
.slot { width: var(--s, 36px); flex: none; height: 48px; border-bottom: 3px solid var(--line); display: grid; place-items: center; font-size: calc(var(--s, 36px) * .8); font-weight: 700; }
.slot.fill { border-color: var(--green); }
.slot.gap { width: calc(var(--s, 36px) * .45); border: 0; }
.slot.fixed { border-color: transparent; color: var(--muted); }
.tiles { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.tile { width: var(--t, 46px); height: calc(var(--t, 46px) + 4px); border-radius: 12px; background: #F3ECF7; border: 2px solid var(--purple); color: var(--purple); font-size: calc(var(--t, 46px) * .56); font-weight: 700; }
.tile[disabled] { visibility: hidden; }
.tile.no { border-color: var(--pink); color: var(--pink); animation: shake .3s; }
@media (prefers-reduced-motion: reduce) { .tile.no { animation: none; } }
.score { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.done { display: grid; gap: 8px; justify-items: center; text-align: center; }
.done .big { font-size: 48px; font-weight: 700; color: var(--green); font-variant-numeric: tabular-nums; }
.loading { text-align: center; color: var(--muted); padding: 40px 0; }
.foot { margin-top: auto; padding-top: 18px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Loading… · Đang tải…</div></div>
<script>
(() => {
  const app = document.getElementById('app');
  const BASE = 'data/flyers/';
  let INDEX = null, THUMBS = {}, cache = {};
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const known = u => store.get('flyers-known-u' + u, []);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pad = n => String(n).padStart(2, '0');

  // ---------- audio ----------
  let player = null;
  function play(src) {
    return new Promise(res => {
      try { if (player) { player.pause(); } } catch (e) {}
      player = new Audio(src);
      player.onended = () => res(true);
      player.onerror = () => res(false);
      const p = player.play();
      if (p && p.catch) p.catch(() => res(false));
    });
  }
  // ---------- sound of the week: each spelling + a word from this unit, tap to hear it ----------
  function soundMatch(w, p, loose) {
    const s = w.en.toLowerCase(), t = w.tricky;
    if (/^[a-z]_e$/.test(p)) {   // magic e: the highlighted vowel, then one consonant, then e
      const re = new RegExp(p[0] + '[^aeiou ]e', 'g'); let m;
      while ((m = re.exec(s))) if (loose || (t && t[0] === m.index)) return [m.index, 1, m.index + 2];
      return null;
    }
    if (/·$/.test(p)) return t && t[1] === 1 && s[t[0]] === p[0] ? [t[0], 1] : null;   // open syllable, e.g. o· in "open"
    if (t && s.substr(t[0], t[1]) === p) return [t[0], p.length];
    if (loose) { const i = s.indexOf(p); if (i >= 0) return [i, p.length]; }
    return null;
  }
  function soundExamples() {
    const used = new Set();
    return U.sound.map(p => {
      let best = null;
      for (const pass of [0, 1]) {
        for (const w of U.words) {
          if (used.has(w.en)) continue;
          const m = soundMatch(w, p, pass === 1);
          if (m) { best = { w, m }; break; }
        }
        if (best) break;
      }
      if (best) used.add(best.w.en);
      return { p, ex: best };
    });
  }
  function hl(en, m) {
    const parts = [[0, m[0], 0], [m[0], m[0] + m[1], 1]];
    if (m[2] != null) parts.push([m[0] + m[1], m[2], 0], [m[2], m[2] + 1, 1], [m[2] + 1, en.length, 0]);
    else parts.push([m[0] + m[1], en.length, 0]);
    return parts.map(([a, b, on]) => on ? `<b>${esc(en.slice(a, b))}</b>` : esc(en.slice(a, b))).join('');
  }
  function soundBox() {
    if (!U.sound || !U.sound.length) return '';
    const ex = soundExamples();
    const chips = ex.map((e, i) => e.ex
      ? `<button class="chip" data-i="${i}" aria-label="Hear ${esc(e.ex.w.en)}"><span class="l">${esc(e.p.replace('_', '–').replace('·', ''))}</span><span class="w">${hl(e.ex.w.en, e.ex.m)}</span>🔊</button>`
      : `<span class="chip"><span class="l">${esc(e.p.replace('_', '–').replace('·', ''))}</span></span>`).join('');
    setTimeout(() => app.querySelectorAll('.sound .chip[data-i]').forEach(b => b.onclick = async () => {
      const w = ex[+b.dataset.i].ex.w;
      app.querySelectorAll('.sound .chip').forEach(x => x.classList.remove('on')); b.classList.add('on');
      await play(w.slow || w.audio); b.classList.remove('on');
    }));
    return `<div class="sound"><span class="k">Sound of the week · Âm của tuần</span><span class="nm">${esc(U.sound_name)}</span>
      <div class="chips">${chips}</div>
      <span class="hint">Tap a word to hear the sound. Say it with the pink letters. · Chạm vào từ để nghe âm. Đọc to phần chữ màu hồng.</span></div>`;
  }
  function stop() { try { if (player) player.pause(); } catch (e) {} }

  // ---------- data ----------
  async function getJSON(path) {
    const r = await fetch(BASE + path);
    if (!r.ok) throw new Error(path + ' ' + r.status);
    return r.json();
  }
  async function unitData(u) {
    if (!cache[u]) cache[u] = await getJSON('u' + pad(u) + '.json');
    return cache[u];
  }

  // ---------- helpers ----------
  function wordHTML(w) {
    const en = w.en.split('/')[0];
    const all = w.en.includes('/') ? w.en.replace('/', ' / ') : w.en;
    if (!w.tricky || w.en.includes('/')) return esc(all);
    const [a, n] = w.tricky;
    return esc(en.slice(0, a)) + '<span class="tr">' + esc(en.slice(a, a + n)) + '</span>' + esc(en.slice(a + n));
  }
  function picHTML(w, cls = 'pic') {
    if (w.label) return `<div class="${cls}"><div class="num" style="color:${w.color}">${esc(w.label)}</div></div>`;
    return `<div class="${cls}"><img src="${w.img}" alt=""></div>`;
  }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function topBar(title, sub, back) {
    return `<div class="top">${back ? `<button class="back" id="back" aria-label="Back to units">‹</button>` : ''}
      <div><h1>${esc(title)}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div></div>`;
  }

  // ---------- home ----------
  function home() {
    stop();
    const units = INDEX.units;
    const totK = units.reduce((a, x) => a + known(x.unit).length, 0), totN = units.reduce((a, x) => a + x.n, 0);
    app.innerHTML = `
      <div class="top"></div>
      <div class="hero"><b>Flyers Word Review</b><span>Look · Listen · Say · Test yourself<br>Nhìn · Nghe · Nói · Tự kiểm tra</span></div>
      <div class="total"><span>${units.length} units · ${totN} words</span><span class="stars">★ ${totK}/${totN} known · đã thuộc</span></div>
      <div class="units">
        ${units.map(x => {
          const k = known(x.unit).length;
          const t = THUMBS[x.unit] ? `<img src="${THUMBS[x.unit]}" alt="">` : `<div class="ph">${x.unit}</div>`;
          return `<button class="unit" data-u="${x.unit}">${t}
            <div><div class="t">Unit ${x.unit} · ${esc(x.title)}</div><div class="n">${x.n} words · ${x.n} từ</div>
            <div class="bar"><i style="width:${Math.round(100 * k / x.n)}%"></i></div></div>
            <div class="stars">★ ${k}/${x.n}</div></button>`;
        }).join('')}
      </div>
      <div class="foot">Tap a unit to start · Chạm vào một bài để bắt đầu</div>`;
    const last = app.querySelector(`.unit[data-u="${store.get('flyers-lastUnit', 0)}"]`);
    if (last) last.scrollIntoView({ block: 'center' }); else window.scrollTo(0, 0);
    app.querySelectorAll('.unit').forEach(el => el.onclick = () => { location.hash = 'u' + pad(el.dataset.u); });
  }

  // ---------- unit shell ----------
  let U = null, mode = 'learn';
  async function openUnit(u, m) {
    stop();
    app.innerHTML = topBar('Unit ' + u, '', true) + `<div class="loading">Loading… · Đang tải…</div>`;
    app.querySelector('#back').onclick = () => { location.hash = 'home'; };
    try { U = await unitData(u); } catch (e) {
      app.innerHTML = topBar('Unit ' + u, '', true) + `<div class="loading">This unit didn't load. Check the internet and tap the unit again.<br>Không tải được. Kiểm tra mạng và thử lại.</div>`;
      app.querySelector('#back').onclick = () => { location.hash = 'home'; };
      return;
    }
    mode = m || 'learn';
    renderUnit();
  }
  function renderUnit() {
    window.scrollTo(0, 0);
    const k = known(U.unit).length;
    app.innerHTML = topBar(`Unit ${U.unit} · ${U.title}`, `★ ${k}/${U.words.length} known · đã thuộc`, true) + `
      ${soundBox()}
      ${U.phrases && U.phrases.length ? `<div class="phr"><span class="k">Useful phrases · Cụm từ hay dùng</span>${U.phrases.map(p => `<div><b>${esc(p[0])}</b> <span>${esc(p[1])}</span></div>`).join('')}</div>` : ''}
      <div class="modes" role="group" aria-label="Mode">
        <button data-m="learn" aria-pressed="${mode === 'learn'}">Learn<small>Học từ</small></button>
        <button data-m="listen" aria-pressed="${mode === 'listen'}">Listen<small>Nghe, chọn</small></button>
        <button data-m="spell" aria-pressed="${mode === 'spell'}">Spell<small>Đánh vần</small></button>
        <button data-m="test" aria-pressed="${mode === 'test'}">Test<small>Kiểm tra</small></button>
      </div>
      <div id="stage"></div>`;
    app.querySelector('#back').onclick = () => { location.hash = 'home'; };
    app.querySelectorAll('.modes button').forEach(el => el.onclick = () => { stop(); mode = el.dataset.m; renderUnit(); });
    ({ learn, listen, spell, test })[mode](app.querySelector('#stage'));
  }

  // ---------- learn ----------
  function learn(st) {
    let i = 0, auto = false;
    function draw() {
      const w = U.words[i];
      st.innerHTML = `<div class="card">
        ${picHTML(w)}
        <div class="word">${wordHTML(w)}</div>
        ${w.ipa ? `<div class="ipa">${esc(w.ipa)}</div>` : ''}
        ${w.syl ? `<div class="syl">${esc(w.syl.replace(/·/g, ' · '))}</div>` : ''}
        <div class="vi">${esc(w.vi)}</div>
        ${w.ex ? `<div class="ex">${esc(w.ex).replace(/\[([^\]]+)\]/g, '<b>$1</b>')}</div>` : ''}
        <div class="row"><button class="btn play" id="say">🔊 Listen</button>
          <button class="btn turtle" id="slow" aria-label="Listen slowly">🐢 Slow</button>
          <button class="btn ghost" id="all">${auto ? '■ Stop' : '▶ Play all'}</button></div>
        <div class="nav"><button class="arrow" id="prev" aria-label="Previous word" ${i === 0 ? 'disabled' : ''}>‹</button>
          <div class="count">${i + 1} / ${U.words.length}</div>
          <button class="arrow" id="next" aria-label="Next word" ${i === U.words.length - 1 ? 'disabled' : ''}>›</button></div>
        <div class="hint">Listen, say it, then write it in your book. · Nghe, nói, rồi viết vào sách.</div></div>`;
      st.querySelector('#say').onclick = () => play(w.audio);
      st.querySelector('#slow').onclick = () => play(w.slow || w.audio);
      st.querySelector('#prev').onclick = () => { auto = false; i--; draw(); };
      st.querySelector('#next').onclick = () => { auto = false; i++; draw(); };
      st.querySelector('#all').onclick = () => { if (auto) { auto = false; stop(); draw(); } else { auto = true; i = 0; run(); } };
    }
    async function run() {
      while (auto && i < U.words.length) {
        draw();
        const ok = await play(U.words[i].audio);
        if (!auto) return;
        if (!ok) { auto = false; draw(); return; }
        await new Promise(r => setTimeout(r, 700));
        if (!auto) return;
        if (i < U.words.length - 1) i++; else { auto = false; draw(); return; }
      }
    }
    draw();
  }

  // ---------- listen & pick ----------
  function listen(st) {
    const order = shuffle(U.words.map((_, k) => k)).slice(0, Math.min(10, U.words.length));
    let r = 0, score = 0, firstTry = true;
    function round() {
      if (r >= order.length) {
        st.innerHTML = `<div class="card done"><div class="big">${score} / ${order.length}</div>
          <div>${score === order.length ? 'Perfect! · Tuyệt vời!' : 'Good work! · Làm tốt lắm!'}</div>
          <div class="hint">Right on the first try · Đúng ngay lần đầu</div>
          <div class="row"><button class="btn blue" id="again">Play again · Chơi lại</button></div></div>`;
        st.querySelector('#again').onclick = () => listen(st);
        return;
      }
      const target = order[r];
      const others = shuffle(U.words.map((_, k) => k).filter(k => k !== target)).slice(0, 3);
      const opts = shuffle([target, ...others]);
      firstTry = true;
      st.innerHTML = `<div class="card">
        <div class="score">Question ${r + 1} of ${order.length} · ★ ${score}</div>
        <div class="row"><button class="btn play" id="hear">🔊 Listen again</button><button class="btn turtle" id="hslow" aria-label="Listen slowly">🐢</button></div>
        <div class="hint">Tap the right picture · Chạm vào tranh đúng</div>
        <div class="choices">${opts.map(k => `<button class="choice" data-k="${k}" aria-label="Picture ${opts.indexOf(k) + 1}">${U.words[k].label ? `<div class="num" style="color:${U.words[k].color}">${esc(U.words[k].label)}</div>` : `<img src="${U.words[k].img}" alt="">`}</button>`).join('')}</div></div>`;
      st.querySelector('#hear').onclick = () => play(U.words[target].audio);
      st.querySelector('#hslow').onclick = () => play(U.words[target].slow || U.words[target].audio);
      st.querySelectorAll('.choice').forEach(el => el.onclick = async () => {
        if (+el.dataset.k === target) {
          el.classList.add('ok');
          if (firstTry) score++;
          st.querySelectorAll('.choice').forEach(c => c.disabled = true);
          await new Promise(res => setTimeout(res, 650));
          r++; round();
        } else { firstTry = false; el.classList.add('no'); el.disabled = true; }
      });
      play(U.words[target].audio);
    }
    st.innerHTML = `<div class="card"><div class="hint">You will hear a word. Tap its picture.<br>Em sẽ nghe một từ. Chạm vào tranh đúng.</div>
      <button class="btn play" id="go">▶ Start · Bắt đầu</button></div>`;
    st.querySelector('#go').onclick = round;   // first audio needs a tap (phone browsers)
  }

  // ---------- spell ----------
  function spell(st) {
    const order = shuffle(U.words.map((_, k) => k)).slice(0, Math.min(8, U.words.length));
    let r = 0, score = 0;
    function round() {
      if (r >= order.length) {
        st.innerHTML = `<div class="card done"><div class="big">${score} / ${order.length}</div>
          <div>${score === order.length ? 'Perfect spelling! · Đánh vần giỏi lắm!' : 'Good work! · Làm tốt lắm!'}</div>
          <div class="hint">No mistakes · Không sai chữ nào</div>
          <div class="row"><button class="btn blue" id="again">Play again · Chơi lại</button></div></div>`;
        st.querySelector('#again').onclick = () => spell(st);
        return;
      }
      const w = U.words[order[r]];
      const target = w.en.split('/')[0];
      const chars = [...target];
      const isLetter = c => /[a-zA-Zé]/.test(c);
      let pos = 0, mistakes = 0;
      while (pos < chars.length && !isLetter(chars[pos])) pos++;
      let tiles = shuffle(chars.map((c, i) => ({ c, i })).filter(t => isLetter(t.c)));
      if (tiles.length > 1 && tiles.every((t, k) => k === 0 || t.i > tiles[k - 1].i)) tiles.reverse();   // never show it already in order
      st.innerHTML = `<div class="card">
        <div class="score">Word ${r + 1} of ${order.length} · ★ ${score}</div>
        <div class="row" style="align-items:center;flex-wrap:nowrap">${picHTML(w, 'pic small')}<div style="display:grid;gap:8px;justify-items:center"><div class="vi">${esc(w.vi)}</div><div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn ghost" id="hear">🔊</button><button class="btn turtle" id="hslow" aria-label="Listen slowly">🐢</button></div></div></div>
        <div class="slots" style="--s:${Math.max(16, Math.min(36, Math.floor(((st.clientWidth || 300) - 36) / chars.length) - 4))}px">${chars.map((c, i) => isLetter(c) ? `<div class="slot" data-i="${i}"></div>` : c === ' ' ? '<div class="slot gap"></div>' : `<div class="slot fixed">${esc(c)}</div>`).join('')}</div>
        <div class="tiles" style="--t:${tiles.length > 8 ? 38 : 46}px">${tiles.map((t, k) => `<button class="tile" data-k="${k}" aria-label="letter ${esc(t.c)}">${esc(t.c)}</button>`).join('')}</div>
        <div class="hint">Tap the letters in order · Chạm các chữ cái theo thứ tự</div></div>`;
      st.querySelector('#hear').onclick = () => play(w.audio);
      st.querySelector('#hslow').onclick = () => play(w.slow || w.audio);
      st.querySelectorAll('.tile').forEach(el => el.onclick = async () => {
        const t = tiles[+el.dataset.k];
        if (t.c.toLowerCase() === chars[pos].toLowerCase()) {
          const slot = st.querySelector(`.slot[data-i="${pos}"]`);
          slot.textContent = chars[pos]; slot.classList.add('fill');
          el.disabled = true;
          pos++; while (pos < chars.length && !isLetter(chars[pos])) pos++;
          if (pos >= chars.length) {
            if (mistakes === 0) score++;
            play(w.audio);
            await new Promise(res => setTimeout(res, 1100));
            r++; round();
          }
        } else {
          mistakes++;
          el.classList.remove('no'); void el.offsetWidth; el.classList.add('no');
        }
      });
      play(w.audio);
    }
    st.innerHTML = `<div class="card"><div class="hint">Look, listen, then spell the word with the letters.<br>Nhìn, nghe, rồi ghép chữ cái thành từ.</div>
      <button class="btn play" id="go">▶ Start · Bắt đầu</button></div>`;
    st.querySelector('#go').onclick = round;
  }

  // ---------- test ----------
  function test(st, only) {
    let order = only || shuffle(U.words.map((_, k) => k));
    let i = 0; const got = [], miss = [];
    const kn = new Set(known(U.unit));
    function draw(shown) {
      if (i >= order.length) {
        order.forEach(k => { if (got.includes(k)) kn.add(U.words[k].en); else kn.delete(U.words[k].en); });
        store.set('flyers-known-u' + U.unit, [...kn]);
        st.innerHTML = `<div class="card done"><div class="big">${got.length} / ${order.length}</div>
          <div>${miss.length === 0 ? 'You know them all! · Em thuộc hết rồi!' : 'Practise these again: · Luyện lại các từ này:'}</div>
          ${miss.length ? `<div class="row" style="gap:6px">${miss.map(k => `<span class="btn ghost" style="min-height:40px;font-size:16px">${esc(U.words[k].en)}</span>`).join('')}</div>` : ''}
          <div class="row">${miss.length ? `<button class="btn again" id="redo">Practise again · Luyện lại</button>` : ''}
          <button class="btn blue" id="restart">New test · Làm lại</button></div></div>`;
        if (miss.length) st.querySelector('#redo').onclick = () => test(st, miss.slice());
        st.querySelector('#restart').onclick = () => test(st);
        return;
      }
      const w = U.words[order[i]];
      st.innerHTML = `<div class="card">
        <div class="score">Word ${i + 1} of ${order.length} · ✓ ${got.length}</div>
        ${picHTML(w)}
        <div class="vi">${esc(w.vi)}</div>
        ${shown ? `<div class="word">${wordHTML(w)}</div>` : `<div class="hidden-word">? ? ?</div>`}
        ${shown
          ? `<div class="hint">Were you right? · Em nói/viết đúng không?</div>
             <div class="row"><button class="btn again" id="no">✗ Not yet · Chưa</button><button class="btn good" id="yes">✓ I knew it · Đúng</button></div>
             <div class="row"><button class="btn ghost" id="say">🔊 Listen</button><button class="btn turtle" id="tslow" aria-label="Listen slowly">🐢 Slow</button></div>`
          : `<div class="hint">Say or write the word, then check. · Nói hoặc viết từ, rồi kiểm tra.</div>
             <div class="row"><button class="btn blue" id="show">Check · Xem đáp án</button></div>`}
      </div>`;
      if (shown) {
        st.querySelector('#yes').onclick = () => { got.push(order[i]); i++; draw(false); };
        st.querySelector('#no').onclick = () => { miss.push(order[i]); i++; draw(false); };
        st.querySelector('#say').onclick = () => play(w.audio);
        st.querySelector('#tslow').onclick = () => play(w.slow || w.audio);
      } else st.querySelector('#show').onclick = () => { draw(true); play(w.audio); };
    }
    draw(false);
  }

  // ---------- routing ----------
  function route() {
    const h = location.hash.replace('#', '');
    const m = /^u(\d\d)$/.exec(h);
    if (m && INDEX.units.some(x => x.unit === +m[1])) {
      const u = +m[1];
      store.set('flyers-lastUnit', u);
      openUnit(u);
    } else home();
  }
  async function start() {
    try {
      INDEX = await getJSON('index.json');
      try { THUMBS = await getJSON('thumbs.json'); } catch (e) { THUMBS = {}; }
    } catch (e) {
      app.innerHTML = `<div class="loading">The app didn't load. Check the internet and refresh the page.<br>Không tải được. Kiểm tra mạng và tải lại trang.</div>`;
      return;
    }
    window.addEventListener('hashchange', route);
    route();
  }
  // offline cache when hosted on its own site (not inside a sandboxed preview)
  try { if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window) { const had = !!navigator.serviceWorker.controller; let done = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !done) { done = true; location.reload(); } });   // new version: reload once
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {}); } } catch (e) {}
  start();
})();
</script>
</body>
</html>
